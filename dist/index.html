<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bce8e6">
  <meta name="description" content="Tap passengers, fill your orange Souha Bus vehicles, and grow your station network.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f78948'/%3E%3Cpath d='M12 19h35l5 22H10z' fill='white'/%3E%3Ccircle cx='20' cy='45' r='5' fill='%23315f4c'/%3E%3Ccircle cx='43' cy='45' r='5' fill='%23315f4c'/%3E%3C/svg%3E">
  <title>Souha Bus — Station Stories</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game">
    <canvas id="scene" aria-label="Interactive three dimensional bus station"></canvas>
    <div id="scene-labels" aria-label="Passengers and buses"></div>

    <header class="hud-top">
      <div class="brand"><span class="brand-icon">▰<i>● ●</i></span><span><b>Souha Bus</b><small>STATION STORIES</small></span></div>
      <div class="top-stats"><div class="coin-pill"><span>€</span><strong id="coins">0</strong></div><button id="sound" class="round-icon" aria-label="Toggle sound">♫</button></div>
    </header>


    <div id="satisfaction-hud" class="progress-hud" aria-label="100% satisfaction means 100% ticket price. Lower satisfaction means lower ticket prices."><div class="progress-icon">☺</div><div><b id="moved">100%</b><small>satisfaction</small><small id="fare-indicator" class="fare-indicator">Ticket price: 100%</small></div></div>

    <div class="scene-callout"><span class="hand">☝</span><span id="scene-hint">Tap a traveler to board your selected bus</span></div>
    <button id="quick-buy-bus" class="quick-buy" aria-label="Buy a Souha Bus for €400 at this station"><span>＋</span><b>Bus</b><small>€400</small></button>

    <section class="bottom-area" aria-label="Station controls">
      <nav class="game-nav" aria-label="Game menus"><button id="station-switch" class="station-switch"><span id="station-flag" class="station-flag"><img class="flag-station" src="./flags/tn.svg" alt="" aria-hidden="true"></span><span><small id="station-queue">100 / 200 WAITING</small><b id="station-name">Tunis Station</b></span><span class="switch-arrow">⌄</span></button><button id="fleet-button"><span class="nav-icon">▰</span><b>My buses</b></button><button id="build-button"><span class="nav-icon">＋</span><b>Expand</b></button></nav>
    </section>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <div id="modal-backdrop" class="modal-backdrop hidden"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grip"></div><div class="sheet-header"><div><small id="sheet-eyebrow">YOUR WORLD</small><h2 id="sheet-title">Stations</h2></div><button id="close-sheet" aria-label="Close menu">×</button></div><div id="sheet-content"></div></div></div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
