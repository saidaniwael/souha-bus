<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <meta name="description" content="SouSou Bus: tap travelers fast, fill your coaches, claim the fares and beat every level's goal before time runs out.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f78948'/%3E%3Cpath d='M12 19h35l5 22H10z' fill='white'/%3E%3Ccircle cx='20' cy='45' r='5' fill='%23315f4c'/%3E%3Ccircle cx='43' cy='45' r='5' fill='%23315f4c'/%3E%3C/svg%3E">
  <title>SouSou Bus — Station Stories</title>
  <link rel="stylesheet" href="./styles.css?v=__BUILD__">
</head>
<body>
  <main id="game" data-mode="home">
    <canvas id="scene" aria-label="Interactive three dimensional bus station"></canvas>
    <div id="scene-labels" aria-label="Travelers and buses"></div>

    <header class="hud-top">
      <button id="pause-btn" class="icon-btn" aria-label="Pause"><i class="ico" style="--i:url(./icons/pause.svg)" aria-hidden="true"></i></button>
      <div id="hearts" class="hearts" aria-label="Hearts left"></div>
      <span class="hud-spacer"></span>
      <div id="timer" class="timer-pill" aria-label="Time left"><i class="ico" style="--i:url(./icons/timer.svg)" aria-hidden="true"></i><b id="timer-text">1:00</b></div>
      <button id="sound" class="icon-btn" aria-label="Toggle sound"></button>
    </header>

    <div class="hud-row">
      <div id="goal-card" class="goal-card" aria-label="Level goal"><span class="goal-head"><b id="goal-level">LEVEL 1</b><small id="goal-text">€0 / €650</small></span><span class="goal-track"><i id="goal-fill"></i></span></div>
      <button id="mult-badge" class="mult-badge" data-level="0" aria-label="Money multiplier and combo"><small id="mult-label">COMBO</small><b id="mult-value">×1</b><span id="mult-boost">goal €650</span><i id="mult-timer"></i></button>
    </div>

    <section class="bottom-area" aria-label="Stations">
      <nav id="station-tabs" class="station-tabs" aria-label="Stations in this level"></nav>
    </section>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <div id="overlay" class="overlay hidden"><div id="overlay-card" class="overlay-card" role="dialog" aria-modal="true"></div></div>
  </main>
  <script type="module" src="./game.js?v=__BUILD__"></script>
</body>
</html>
